<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cida em RA · Rádio Cidade 97.7</title>
<meta name="theme-color" content="#E61973">
<meta name="description" content="Coloque a Cida, a personagem da Rádio Cidade 97.7, no seu espaço em realidade aumentada.">
<script type="module" src="model-viewer.min.js"></script>
<style>
@font-face{font-family:'Lito';src:url(../apresentacao-cida/fonts/LitoStencil.otf) format('opentype');font-display:swap}
@font-face{font-family:'Mont';src:url(../apresentacao-cida/fonts/montserrat-latin-600-normal-UVxSCcoG.woff2) format('woff2');font-weight:600}
@font-face{font-family:'Mont';src:url(../apresentacao-cida/fonts/montserrat-latin-800-normal-axpkC1rd.woff2) format('woff2');font-weight:800}
:root{--pulso:#E61973;--freq:#2558FF;--sol:#FFD60A;--coral:#F24444;--ink:#121316;--papel:#F7F4EB}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--pulso);color:var(--papel);font-family:'Mont',Arial,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
.fundo{position:fixed;inset:0;overflow:hidden;pointer-events:none}
.fundo b{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);font-family:'Lito';font-weight:400;font-size:min(62vw,52vh);line-height:.8;color:var(--papel);letter-spacing:-.01em;opacity:.95}
.fundo i{position:absolute;left:50%;top:38%;width:min(150vw,150vh);aspect-ratio:1;border-radius:50%;border:2px solid rgba(247,244,235,.22);transform:translate(-50%,-50%) scale(var(--s));animation:anel 4s linear infinite}
@keyframes anel{from{opacity:.9;transform:translate(-50%,-50%) scale(.2)}to{opacity:0;transform:translate(-50%,-50%) scale(1)}}
header{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:max(16px,env(safe-area-inset-top)) 20px 0}
header img{height:40px;width:auto}
header span{font-weight:800;font-size:13px;background:var(--ink);border-radius:999px;padding:8px 13px}
model-viewer{position:fixed;left:0;right:0;top:64px;bottom:var(--painel,280px);width:100%;height:auto;--poster-color:transparent;background:transparent;z-index:2}
model-viewer::part(default-progress-bar){background:var(--sol);height:4px}
.painel{position:fixed;left:0;right:0;bottom:0;z-index:4;padding:0 20px max(22px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;pointer-events:none}
.painel>*{pointer-events:auto}
h1{font-family:'Lito';font-weight:400;font-size:clamp(34px,9vw,56px);line-height:.88;text-transform:uppercase;text-shadow:0 2px 0 rgba(0,0,0,.08)}
h1 em{font-style:normal;color:var(--sol)}
p{font-weight:600;font-size:15px;line-height:1.4;max-width:24em}
.ra{display:inline-flex;align-items:center;gap:10px;border:0;border-radius:999px;background:var(--sol);color:var(--ink);font:800 17px 'Mont',sans-serif;padding:17px 26px;box-shadow:0 14px 34px rgba(0,0,0,.25);cursor:pointer;animation:pulsa 1.8s ease-in-out infinite}
.ra svg{width:24px;height:24px}
@keyframes pulsa{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.sem-ra{display:none;background:var(--papel);color:var(--ink);border-radius:22px;padding:14px 16px;align-items:center;gap:14px;text-align:left;max-width:420px}
.sem-ra img{width:96px;height:96px;flex:none}
.sem-ra b{display:block;font-weight:800;font-size:15px;margin-bottom:3px}
.sem-ra span{font-weight:600;font-size:13px;line-height:1.35}
body.desktop .sem-ra{display:flex}
body.desktop .ra{display:none}
.dica{font-size:12.5px;opacity:.85}
@media (prefers-reduced-motion:reduce){.fundo i,.ra{animation:none}}
</style>
</head>
<body>
<div class="fundo" aria-hidden="true"><i style="animation-delay:0s"></i><i style="animation-delay:-1.33s"></i><i style="animation-delay:-2.66s"></i><b>Cida</b></div>

<header><img src="logo.webp" alt="Rádio Cidade 97.7 FM"><span>Realidade aumentada</span></header>

<model-viewer id="mv" src="cida-ra-anim.glb" animation-name="tchau" autoplay alt="Cida, personagem 3D da Rádio Cidade, acenando"
  ar ar-modes="webxr scene-viewer quick-look" ar-placement="floor" ar-scale="auto"
  camera-controls touch-action="pan-y"
  camera-orbit="0deg 84deg 100%" field-of-view="28deg" min-camera-orbit="auto 40deg auto" max-camera-orbit="auto 100deg auto"
  shadow-intensity="1" shadow-softness=".8" exposure="1.05" environment-image="neutral" interaction-prompt="none">
  <button slot="ar-button" hidden></button>
</model-viewer>

<div class="painel">
  <h1>Leva a Cida<br><em>pra sua casa.</em></h1>
  <p>Toque no botão, aponte a câmera para o chão e ela aparece do seu tamanho. Dá pra girar, mudar o tamanho e tirar foto.</p>
  <button class="ra" id="btnRA" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l8 4.5v9L12 20l-8-4.5v-9z"/><path d="M12 11l8-4.5M12 11v9M12 11L4 6.5"/></svg>Ver no meu espaço</button>
  <div class="sem-ra"><img src="qr-ra.svg" alt="QR code desta página"><div><b>Abra no celular</b><span>Realidade aumentada funciona no celular. Aponte a câmera para o código e toque em “Ver no meu espaço”.</span></div></div>
  <span class="dica" id="dica"></span>
</div>

<script type="module">
const mv = document.getElementById('mv'), btn = document.getElementById('btnRA'), dica = document.getElementById('dica');
const celular = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
if (!celular) document.body.classList.add('desktop');
// iPhone: a RA do sistema não toca a animação do esqueleto; usa a Cida já na pose de tchau
if (/iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) { mv.removeAttribute('autoplay'); mv.src = 'cida-ra-pose.glb'; }
// painel embaixo define onde a Cida termina
const painel = document.querySelector('.painel');
const mede = () => document.documentElement.style.setProperty('--painel', (painel.offsetHeight + 10) + 'px');
addEventListener('resize', mede); mede(); document.fonts.ready.then(mede);
// balanço suave até a pessoa mexer
let mexeu = false; mv.addEventListener('camera-change', e => { if (e.detail.source === 'user-interaction') mexeu = true; });
(function balanca(t) { if (!mexeu) mv.cameraOrbit = `${Math.sin(t / 1600) * 22}deg 84deg 100%`; requestAnimationFrame(balanca); })(0);
btn.addEventListener('click', () => {
  if (mv.canActivateAR) mv.activateAR();
  else dica.textContent = 'Seu celular não abriu a câmera de RA. No Android, atualize o Google Play Services para RA; no iPhone, abra no Safari.';
});
mv.addEventListener('ar-status', e => { if (e.detail.status === 'failed') dica.textContent = 'Não deu pra abrir a RA agora. Tente de novo apontando para um chão bem iluminado.'; });
</script>
</body>
</html>
