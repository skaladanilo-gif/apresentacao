<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cida · Rádio Cidade 97.7</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--pulso:#E61973;--freq:#2558FF;--sol:#FFD60A;--coral:#F24444;--asf:#121316;--papel:#F7F4EB}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Montserrat',Arial,sans-serif;background:var(--freq);color:var(--asf);overflow:hidden}
.app{height:100%;display:grid;grid-template-columns:minmax(300px,1fr) minmax(380px,560px);gap:0}
/* palco */
.stage{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;overflow:hidden}
.stage .top{position:absolute;top:24px;left:28px;right:28px;display:flex;align-items:center;justify-content:space-between}
.stage .top img{height:64px}
.tag{font-size:12px;font-weight:800;letter-spacing:2px;background:var(--sol);color:var(--asf);padding:8px 14px;border-radius:99px}
.rings{position:absolute;width:min(78vh,46vw);height:min(78vh,46vw);left:50%;top:50%;transform:translate(-50%,-50%)}
.rings svg{width:100%;height:100%;animation:spin 60s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.face{position:relative;width:min(46vh,30vw);height:min(46vh,30vw);border-radius:50%;overflow:hidden;clip-path:circle(50%);isolation:isolate;border:10px solid var(--papel);background:#7a3a22;animation:bob 3.2s ease-in-out infinite}
.face img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 70ms linear;border-radius:50%}
.face img.base{opacity:1;transition:none}
.face img.on{opacity:1}
.stage.talking .face{animation:bob 1.1s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-8px) rotate(-1deg)}}
.name{position:relative;margin-top:28px;text-align:center;color:var(--papel)}
.name h1{font-family:'Lilita One',sans-serif;font-weight:400;font-size:clamp(40px,6vh,64px);line-height:1}
.status{display:inline-flex;align-items:center;gap:10px;margin-top:10px;font-weight:700;font-size:15px}
.dot{width:10px;height:10px;border-radius:50%;background:#7CF29C;box-shadow:0 0 0 4px rgba(124,242,156,.25)}
.stage.talking .dot{background:var(--sol);box-shadow:0 0 0 4px rgba(255,214,10,.3)}
.stage.listening .dot{background:var(--coral);box-shadow:0 0 0 4px rgba(242,68,68,.3);animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 10px rgba(242,68,68,0)}}
.facewrap{position:relative;filter:drop-shadow(0 18px 0 rgba(18,19,22,.25))}
.react{position:absolute;right:-16%;bottom:-6%;width:40%;transform:scale(0) rotate(-12deg);transition:transform .45s cubic-bezier(.34,1.56,.64,1)}
.react.show{transform:scale(1) rotate(6deg)}
.react img{width:100%;filter:drop-shadow(0 10px 0 rgba(18,19,22,.25))}
/* chat */
.chat{background:var(--papel);display:flex;flex-direction:column;min-height:0;border-left:6px solid var(--asf)}
.chat header{padding:22px 24px 14px;border-bottom:2px solid #e6e1d4}
.chat header h2{font-family:'Lilita One',sans-serif;font-weight:400;font-size:30px}
.chat header p{font-size:13px;color:#5b5c62;margin-top:4px;font-weight:600}
.msgs{flex:1;overflow-y:auto;padding:20px 20px 8px;display:flex;flex-direction:column;gap:14px}
.m{display:flex;gap:10px;align-items:flex-end;max-width:92%}
.m .b{padding:12px 16px;border-radius:20px;font-size:16px;line-height:1.45;font-weight:500}
.m.cida .b{background:#fff;border:2px solid var(--asf);border-bottom-left-radius:6px}
.b.dots{display:flex;gap:5px;align-items:center;padding:16px 18px}.b.dots i{width:8px;height:8px;border-radius:50%;background:var(--asf);opacity:.35;animation:dot 1s infinite}.b.dots i:nth-child(2){animation-delay:.15s}.b.dots i:nth-child(3){animation-delay:.3s}@keyframes dot{40%{opacity:1;transform:translateY(-3px)}}
.m.cida .ouvir{align-self:flex-end;margin-left:6px;display:inline-flex;gap:6px;align-items:center;font:700 13px Montserrat,sans-serif;background:var(--pulso,#E61973);color:#fff;border:0;border-radius:99px;padding:8px 13px;cursor:pointer;animation:pulsa 1.4s ease-in-out infinite}.m.cida .ouvir svg{width:16px;height:16px}@keyframes pulsa{50%{transform:scale(1.06)}}
.m.cida img{width:52px;height:58px;object-fit:contain;flex:none}
.m.eu{align-self:flex-end}
.m.eu .b{background:var(--freq);color:var(--papel);border-bottom-right-radius:6px}
.chips{display:flex;gap:8px;flex-wrap:wrap;padding:8px 20px 12px}
.chips button{font:700 13px 'Montserrat',sans-serif;border:2px solid var(--asf);background:#fff;border-radius:99px;padding:8px 12px;cursor:pointer}
.chips button:hover{background:var(--sol)}
form{display:flex;gap:10px;padding:14px 20px 20px;border-top:2px solid #e6e1d4}
form input{flex:1;font:600 16px 'Montserrat',sans-serif;padding:14px 16px;border:2px solid var(--asf);border-radius:16px;background:#fff;min-width:0}
.btn{flex:none;width:52px;height:52px;border-radius:16px;border:2px solid var(--asf);cursor:pointer;display:grid;place-items:center;font-size:20px}
.send{background:var(--pulso);color:#fff}
.mic{background:var(--sol)}
.mic.on{background:var(--coral);color:#fff;animation:pulse 1s infinite}
.opts{display:flex;justify-content:space-between;align-items:center;padding:0 20px 14px;font-size:12px;font-weight:700;color:#5b5c62}
.opts label{display:flex;gap:6px;align-items:center;cursor:pointer}
.opts select{font:700 12px 'Montserrat',sans-serif;border:2px solid var(--asf);border-radius:8px;padding:3px 6px;background:#fff}
.note{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--asf);color:var(--papel);font-size:13px;font-weight:600;padding:10px 16px;border-radius:12px;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90vw;text-align:center}
.note.show{opacity:1}
@media (max-width:700px){
  body{overflow:auto}
  .app{grid-template-columns:1fr;grid-template-rows:auto 1fr;height:auto;min-height:100%}
  .stage{min-height:52vh;padding-top:96px}
  .face{width:56vw;height:56vw}
  .rings{width:96vw;height:96vw}
  .chat{border-left:none;border-top:6px solid var(--asf);min-height:60vh}
}
</style>
</head>
<body>
<div class="app">
  <section class="stage" id="stage">
    <div class="rings"><svg viewBox="0 0 600 600" aria-hidden="true" id="ringsvg"></svg></div>
    <div class="top"><img src="img/logo.webp" alt="Rádio Cidade 97.7 FM"><span class="tag">PROTÓTIPO</span></div>
    <div class="facewrap"><div class="face" id="face" aria-label="Cida falando"></div>
    <div class="react" id="react"><img id="reactImg" alt=""></div></div>
    <div class="name"><h1>Cida</h1><div class="status"><span class="dot"></span><span id="status">online agora</span></div></div>
  </section>
  <section class="chat">
    <header><h2>Fala com a Cida</h2><p>A voz da Rádio Cidade em forma de gente. Escreva ou toque no microfone.</p></header>
    <div class="msgs" id="msgs" aria-live="polite"></div>
    <div class="chips" id="chips"></div>
    <form id="form" autocomplete="off">
      <input id="inp" placeholder="Pergunta pra Cida…" aria-label="Mensagem para a Cida">
      <button type="button" class="btn mic" id="mic" title="Falar com a Cida" aria-label="Falar com a Cida">🎙️</button>
      <button type="submit" class="btn send" title="Enviar" aria-label="Enviar">➤</button>
    </form>
    <div class="opts"><label><input type="checkbox" id="voz" checked> Voz da Cida ligada</label><select id="prov" hidden><option value="gemini">Gemini</option><option value="eleven">ElevenLabs</option></select><span id="modo">modo demonstração</span></div>
  </section>
</div>
<div class="note" id="note"></div>
<script>
// ===== Configuração =====
// Quando houver a função com a chave do Claude, coloque o endereço aqui (ex.: "/.netlify/functions/cida").
const API_URL = "https://ygvckbjzxxpqchqpyoug.supabase.co/functions/v1/cida";

// ===== Anéis da marca: reagem à voz da Cida =====
let ringTarget=0;
(function(){
  const cols=['#FFD60A','#E61973','#F24444','#F7F4EB','#FFD60A','#E61973'];
  const svg=document.getElementById('ringsvg');
  svg.innerHTML=cols.map(c=>`<path fill="${c}"/>`).join('');
  const paths=[...svg.querySelectorAll('path')];
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  let amp=0,last=performance.now(),ph=0;const hist=[];   // histórico do volume pra onda sair do centro
  function ampAgo(ms,now){for(let j=hist.length-1;j>=0;j--)if(now-hist[j][0]>=ms)return hist[j][1];return hist.length?hist[0][1]:0}
  function draw(now){
    const dt=Math.min(.05,(now-last)/1000);last=now;
    amp+=(ringTarget-amp)*(ringTarget>amp?.5:.15);
    hist.push([now,amp]);while(hist.length&&now-hist[0][0]>700)hist.shift();
    ph+=dt*(0.5+amp*4);
    const n=cols.length;
    paths.forEach((p,i)=>{
      // anel de dentro reage primeiro; a onda chega nos de fora 70 ms depois, um por um
      const a=ampAgo((n-1-i)*70,now);
      const R=290*(1-i/n)*(1+a*0.10);
      const wav=0.03+a*0.12,lobes=8+(i%2);
      let d='';
      for(let k=0;k<=96;k++){const t=k/96*Math.PI*2;
        const r=R*(1+wav*Math.sin(lobes*t+i*.5+ph*(i%2?1:-1)*(1+i*.15)));
        d+=(k?'L':'M')+(300+r*Math.cos(t)).toFixed(1)+' '+(300+r*Math.sin(t)).toFixed(1)}
      p.setAttribute('d',d+'Z');
    });
    if(!reduce)requestAnimationFrame(draw);
  }
  draw(performance.now());
})();

// ===== Rosto e bocas =====
const SHAPES=['repouso','leve','dentes','e','a','o','i'];
const face=document.getElementById('face'),imgs={};
SHAPES.forEach(n=>{const im=new Image();im.src=`img/boca-${n==='repouso'?'fechada':n}.webp`;im.alt='';face.appendChild(im);imgs[n]=im});
let cur='';function mouth(n){if(n===cur)return;if(imgs[cur]&&cur!=='repouso')imgs[cur].classList.remove('on');if(n!=='repouso')imgs[n].classList.add('on');cur=n}
imgs.repouso.classList.add('base');
mouth('repouso');
const MOODS={feliz:'expc-feliz',chocada:'expc-chocada',curtindo:'expc-curtindo',desconfiada:'expc-desconfiada',rindo:'expc-rindo',piscadinha:'expc-piscadinha'};
Object.values(MOODS).forEach(f=>{new Image().src=`img/${f}.webp`});
function viseme(ch){
  const c=ch.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
  if(c==='a')return 'a'; if(c==='e')return 'e'; if(c==='i'||c==='y')return 'i'; if(c==='o'||c==='u'||c==='w')return 'o';
  if('mbp'.includes(c))return 'repouso'; if('fvltdnr'.includes(c))return 'dentes'; if('szxjc'.includes(c))return 'i';
  if(/[a-z]/.test(c))return 'leve'; return 'repouso';
}

// ===== Voz =====
let voice=null;
function pickVoice(){const vs=speechSynthesis.getVoices().filter(v=>/^pt(-|_)BR/i.test(v.lang));
  const pref=['Luciana','Francisca','Google português do Brasil','Fernanda','Maria','Vitoria','Thalita'];
  voice=vs.find(v=>pref.some(p=>v.name.includes(p)))||vs[0]||null}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}

const stage=document.getElementById('stage'),statusEl=document.getElementById('status');
function setStatus(t,cls){statusEl.textContent=t;stage.classList.remove('talking','listening');if(cls)stage.classList.add(cls)}

// fala: anima a boca sincronizada com o texto (e com a voz, quando ligada)
let talkId=0;
function speak(text,bubble,allowVoice=true){
  const my=++talkId;
  return new Promise(res=>{
    const useVoice=allowVoice&&document.getElementById('voz').checked&&'speechSynthesis' in window&&voice;
    const cps=useVoice?14.5:17; let base=0,baseT=performance.now(),done=false,last=-1;
    setStatus('falando…','talking');
    function frame(now){
      if(done)return;
      if(my!==talkId){done=true;bubble.textContent=text;res();return}
      let idx=Math.floor(base+(now-baseT)/1000*cps);
      if(idx>=text.length){idx=text.length; if(!useVoice){finish();return}}
      if(idx!==last){bubble.textContent=text.slice(0,Math.max(idx,1));last=idx;scrollDown()}
      {const vm=idx<text.length?viseme(text[idx]):'repouso';ringTarget=vm==='repouso'?0.05:(vm==='a'||vm==='o'?0.7:0.4);mouth(vm)}
      requestAnimationFrame(frame);
    }
    function finish(){if(done)return;done=true;ringTarget=0;bubble.textContent=text;mouth('repouso');setStatus('online agora');res()}
    if(useVoice){
      speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(text);u.lang='pt-BR';u.voice=voice;u.rate=1.08;u.pitch=1.15;
      u.onboundary=e=>{if(typeof e.charIndex==='number'){base=e.charIndex;baseT=performance.now()}};
      u.onend=finish;u.onerror=finish;
      speechSynthesis.speak(u);
      setTimeout(finish,text.length/cps*1000+6000);
    }
    requestAnimationFrame(frame);
  });
}

// ===== Voz do Gemini (áudio de verdade) =====
// Um único player, liberado no clique do usuário (Safari e Chrome bloqueiam som que começa depois de esperar a internet).
const player=new Audio();player.preload='auto';
const SILENT='data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=';
let unlocked=false;
const prov=document.getElementById('prov');
prov.onchange=()=>{try{localStorage.setItem('cida-voz',prov.value)}catch(e){}};
player.addEventListener('playing',()=>{unlocked=true});
function unlockAudio(){
  if(unlocked||!player.paused)return;unlocked=true;
  try{player.src=SILENT;const p=player.play();if(p)p.catch(()=>{unlocked=false})}catch(e){unlocked=false}
  if('speechSynthesis' in window){try{speechSynthesis.speak(new SpeechSynthesisUtterance(''))}catch(e){}}
}
// lê o WAV e monta a "trilha de bocas" a cada 10 ms, a partir do próprio som
function mouthTrack(u8){
  try{const dv=new DataView(u8.buffer);let p=12,rate=24000,bits=16,ch=1,start=-1,len=0;
    while(p+8<=u8.length){const id=String.fromCharCode(u8[p],u8[p+1],u8[p+2],u8[p+3]),sz=dv.getUint32(p+4,true);
      if(id==='fmt '){ch=dv.getUint16(p+10,true);rate=dv.getUint32(p+12,true);bits=dv.getUint16(p+22,true)}
      if(id==='data'){start=p+8;len=Math.min(sz,u8.length-start);break}p+=8+sz+(sz&1)}
    if(start<0||bits!==16)return null;
    const n=Math.floor(len/2/ch),hop=Math.round(rate/100),F=Math.ceil(n/hop),amp=new Float32Array(F),zcr=new Float32Array(F);
    for(let f=0;f<F;f++){let s=0,z=0,c=0,prev=0;
      for(let i=f*hop;i<Math.min(n,(f+1)*hop);i++){const v=dv.getInt16(start+i*2*ch,true)/32768;s+=v*v;if((v>=0)!==(prev>=0))z++;prev=v;c++}
      amp[f]=c?Math.sqrt(s/c):0;zcr[f]=c?z/c:0}
    // suaviza e normaliza pelo pico da fala
    const sm=new Float32Array(F);for(let f=0;f<F;f++){let t=0,k=0;for(let j=f-2;j<=f+2;j++)if(j>=0&&j<F){t+=amp[j];k++}sm[f]=t/k}
    const sorted=Array.from(sm).sort((x,y)=>x-y),peak=sorted[Math.floor(F*0.97)]||1e-6;
    const track=new Array(F);let cur='repouso',hold=0,alt=0;
    for(let f=0;f<F;f++){
      const x=Math.min(sm[f]/peak,1.2),hiss=zcr[f]>0.28;
      let want;
      if(x<0.12)want='repouso';
      else if(hiss&&x<0.6)want='i';
      else if(x<0.25)want='leve';
      else if(x<0.42)want='dentes';
      else if(x<0.66)want='e';
      else want=(alt%4===3?'o':'a');
      if(want!==cur&&hold<=0){cur=want;hold=9;if(want==='a'||want==='o')alt++}
      hold--;track[f]=cur;
    }
    track.amp=Array.from(sm,v=>Math.min(v/peak,1.2));
    return track}catch(e){return null}
}
async function fetchVoice(text,mood){
  try{const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({acao:'voz',text,mood,provider:prov.value})});
    if(!r.ok)return null;const j=await r.json();if(!j.audio)return null;
    if(prov.value==='eleven'&&!(j.model||'').startsWith('elevenlabs'))toast('ElevenLabs indisponível agora, usei a voz do Gemini.');
    const bin=atob(j.audio),u8=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);
    return {url:URL.createObjectURL(new Blob([u8],{type:j.mime||'audio/wav'})),track:mouthTrack(u8)};}catch(e){return null}
}
function speakAudio(text,bubble,v,from=0,to=text.length,last=true){
  const my=++talkId;
  return new Promise(res=>{
    let done=false,lastI=-1;setStatus('falando…','talking');
    function frame(){
      if(done)return;
      if(my!==talkId){finish(true);return}
      const d=player.duration||0,t=player.currentTime,p=d&&isFinite(d)?Math.min(t/d,1):0,idx=from+Math.floor(p*(to-from));
      if(idx!==lastI){bubble.textContent=text.slice(0,Math.max(idx,1));lastI=idx;scrollDown()}
      let m;
      if(v.track){m=v.track[Math.floor((t+0.03)*100)]||'repouso'}
      else{m=idx<to?viseme(text[idx]):'repouso'}
      ringTarget=v.track&&v.track.amp?Math.min(1,(v.track.amp[Math.floor((t+0.03)*100)]||0)):(m==='repouso'?0.1:0.6);
      mouth(m);requestAnimationFrame(frame);
    }
    function finish(ok=true){if(done)return;done=true;const meu=my===talkId;if(meu){ringTarget=0;player.onended=player.onerror=null;mouth('repouso')}bubble.textContent=meu?text.slice(0,to):text;if(last&&meu)setStatus('online agora');if(v.revoke!==false)URL.revokeObjectURL(v.url);res(ok)}
    player.onended=()=>finish(true);player.onerror=()=>finish(true);
    player.src=v.url;
    player.play().then(()=>requestAnimationFrame(frame)).catch(()=>{finish(false)});
  });
}
// trecho sem voz: só anima a boca e o texto
function revealSilent(text,bubble,from,to){
  const my=++talkId;
  return new Promise(res=>{const t0=performance.now();setStatus('falando…','talking');
    (function f(now){if(my!==talkId){bubble.textContent=text.slice(0,to);return res()}
      const idx=Math.min(to,from+Math.floor((now-t0)/1000*17));bubble.textContent=text.slice(0,Math.max(idx,1));scrollDown();
      const vm=idx<to?viseme(text[idx]):'repouso';ringTarget=vm==='repouso'?0.05:0.5;mouth(vm);
      if(idx>=to){ringTarget=0;mouth('repouso');return res()}requestAnimationFrame(f)})(t0)});
}
function b64Voice(b64,mime){const bin=atob(b64),u8=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);
  return {url:URL.createObjectURL(new Blob([u8],{type:mime||'audio/wav'})),track:mouthTrack(u8)}}

// ===== Conversa =====
const msgs=document.getElementById('msgs');function scrollDown(){msgs.scrollTop=msgs.scrollHeight}
function addMe(t){const d=document.createElement('div');d.className='m eu';d.innerHTML='<div class="b"></div>';d.firstChild.textContent=t;msgs.appendChild(d);scrollDown()}
function addCida(mood){const d=document.createElement('div');d.className='m cida';d.innerHTML=`<img src="img/${MOODS[mood]||MOODS.feliz}.webp" alt="Cida ${mood}"><div class="b"></div>`;msgs.appendChild(d);scrollDown();return d.querySelector('.b')}
const react=document.getElementById('react'),reactImg=document.getElementById('reactImg');
function showMood(mood){reactImg.src=`img/${MOODS[mood]||MOODS.feliz}.webp`;react.classList.remove('show');void react.offsetWidth;react.classList.add('show');clearTimeout(showMood.t);showMood.t=setTimeout(()=>react.classList.remove('show'),4200)}

// respostas do modo demonstração (sem IA ainda)
const norm=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
let ctx='';
function demo(q){
  const t=norm(q);
  const R=(text,mood,c='')=>{ctx=c;return {text,mood}};
  if(ctx==='babado'&&/\b(conta|quero|sim|bora|manda|fala|claro)\b/.test(t))return R('Então senta que lá vem! Rolou um climão nos bastidores e todo mundo tá comentando. Os detalhes saem hoje no nosso perfil, o @cidade.plus. E ó: eu só conto o que é confirmado. Fofoca, sim. Fake, nunca!','desconfiada');
  if(/\b(oi|ola|oie|oiee|eai|e ai|bom dia|boa tarde|boa noite|salve|hey)\b/.test(t))return R('Oiê! Aqui é a Cida, da Rádio Cidade 97.7! Quer saber o que tá tocando, um babado fresquinho ou uma indicação de música?','feliz');
  if(/(quem e voce|quem e vc|seu nome|quem e a cida|o que voce faz|vc e quem|voce e quem)/.test(t))return R('Eu sou a Cida, a voz da Rádio Cidade em forma de gente! Tenho 20 anos, não largo o meu fone, sei de tudo primeiro e sempre tenho uma música pra indicar.','piscadinha');
  if(/(tocando|toca agora|no ar|o que toca|programacao|musica agora)/.test(t))return R('Agora tá rolando o lançamento da Ludmilla, o hino do Carnaval que já tem dona! Aumenta o som que essa toca aqui todo dia.','curtindo');
  if(/(babado|fofoca|fofoq|treta|polemica|novidade|bafo|tea)/.test(t))return R('Gente, para tudo! O Alto Leblon tá pegando fogo e a Marina tá no meio do furacão. Quer que eu te conte?','chocada','babado');
  if(/(verdade|e fake|mentira|confirmad|boato)/.test(t))return R('Hum… se eu não confirmei, eu não espalho. Aqui é assim: fofoca, sim. Fake, nunca.','desconfiada');
  if(/(indica|recomenda|sugere|sugestao|playlist|musica pra|o que ouvir|me indica)/.test(t))return R('Anota aí: tá no nosso radar o comeback do BTS. ARMY, segura o coração! Se você curte pop, essa vai grudar na cabeça.','feliz');
  if(/(reality|bbb|big brother|fazenda|paredao|eliminad)/.test(t))return R('Ai, reality é a minha vida! Eu assisto tudo e comento tudo, mas sem cancelar ninguém. Quem é o seu favorito?','rindo');
  if(/(look|roupa|moda|vestir|estilo|outfit)/.test(t))return R('Minha dica: mistura uma peça vintage com algo que tá em alta. Suéter listrado, bermuda larga e tênis. E nunca esquece o fone!','piscadinha');
  if(/(obrigad|valeu|tchau|ate mais|beijo|bjs|flw)/.test(t))return R('Imagina! Fica comigo que eu te conto. Toca aqui, toca na Cidade!','piscadinha');
  if(/(kkk|haha|rsrs|kakak)/.test(t))return R('Não aguento, socorro! Você é das minhas.','rindo');
  return R('Hum, essa eu ainda não sei responder: por enquanto eu tô no modo demonstração. Me pergunta o que tá tocando, pede um babado ou uma indicação de música!','desconfiada');
}

// pede texto e voz numa chamada só; a voz vem frase por frase e a 1ª já começa a tocar
async function falaIA(withVoice){
  const ac=new AbortController(),to=setTimeout(()=>ac.abort(),14000);
  const r=await fetch(API_URL,{method:'POST',signal:ac.signal,headers:{'Content-Type':'application/json'},body:JSON.stringify({acao:'fala',voz:withVoice,messages:hist})});
  if(!r.ok||!r.body)throw new Error('http');
  const rd=r.body.getReader(),dec=new TextDecoder();let buf='',info=null;const waits={},got={};let fimR;const fim=new Promise(z=>fimR=z);
  const parte=i=>i in got?Promise.resolve(got[i]):new Promise(z=>{waits[i]=z});
  const ok=new Promise((resolve,reject)=>{
    (async()=>{try{for(;;){const {value,done}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});let k;
      while((k=buf.indexOf('\n'))>=0){const line=buf.slice(0,k);buf=buf.slice(k+1);if(!line.trim())continue;const j=JSON.parse(line);
        if(j.t==='texto'){info=j;clearTimeout(to);resolve(j)}
        else if(j.t==='audio'||j.t==='semvoz'){const v=j.t==='audio'?b64Voice(j.audio,j.mime):null;got[j.i]=v;if(waits[j.i])waits[j.i](v)}
        else if(j.t==='erro'){reject(new Error(j.detail||'erro'))}}}
      }catch(e){reject(e)}finally{if(!info)reject(new Error('sem texto'));for(const i in waits)if(!(i in got))waits[i](null);fimR()}})();
  });
  const j=await ok;return {text:j.text,mood:j.mood||'feliz',partes:j.partes||[],parte,ai:true};
}
async function send(q){
  q=(q||'').trim();if(!q||busy)return;busy=true;unlockAudio();welcomeDone=true;
  addMe(q);hist.push({role:'user',content:q});
  setStatus('digitando…');typing(true);
  const wantVoice=document.getElementById('voz').checked;
  let a=null;
  if(API_URL){try{a=await falaIA(wantVoice);setModo('IA conectada')}catch(e){a=null}}
  if(!a){a=await answer(q)}
  hist.push({role:'assistant',content:a.text});
  if(a.parte&&a.partes.length){
    // posição de cada frase no texto, para a legenda acompanhar a voz
    let cur=0;const cortes=a.partes.map((p,i)=>{const at=a.text.indexOf(p,cur);const s=at>=0?at:cur;cur=i===a.partes.length-1?a.text.length:(at>=0?at+p.length:Math.round(a.text.length*(i+1)/a.partes.length));return [s,cur]});
    cortes[cortes.length-1][1]=a.text.length;
    showMood(a.mood);setStatus('gravando áudio…');
    const v0=await a.parte(0);typing(false);const b=addCida(a.mood);
    for(let i=0;i<cortes.length;i++){
      const v=i===0?v0:await a.parte(i);const [s,e]=cortes[i];const from=i===0?0:s;
      if(v){const ok=await speakAudio(a.text,b,v,from,e,i===cortes.length-1);if(!ok){toast('Toque na tela para liberar o som da Cida.');await revealSilent(a.text,b,from,a.text.length);break}}
      else if(i===0&&cortes.length===1&&document.getElementById('voz').checked&&voice)await speak(a.text,b,true); // sem a voz da IA: usa a voz do aparelho
      else await revealSilent(a.text,b,from,e);
    }
    b.textContent=a.text;setStatus('online agora');
  }else{
    typing(false);showMood(a.mood);const b=addCida(a.mood);await speak(a.text,b,false);
  }
  busy=false;
}

const note=document.getElementById('note');function toast(t){note.textContent=t;note.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>note.classList.remove('show'),4000)}
const micBtn=document.getElementById('mic');let rec=null;
function wavFrom(chunks,inRate){
  const total=chunks.reduce((n,c)=>n+c.length,0),data=new Float32Array(total);let o=0;for(const c of chunks){data.set(c,o);o+=c.length}
  const outRate=16000,ratio=inRate/outRate,n=Math.floor(total/ratio),pcm=new Int16Array(n);
  for(let i=0;i<n;i++){let s=0,k=0;for(let j=Math.floor(i*ratio);j<Math.min(total,Math.floor((i+1)*ratio));j++){s+=data[j];k++}const v=Math.max(-1,Math.min(1,k?s/k:0));pcm[i]=v*32767}
  const buf=new ArrayBuffer(44+pcm.length*2),dv=new DataView(buf);const W=(p,s)=>{for(let i=0;i<s.length;i++)dv.setUint8(p+i,s.charCodeAt(i))};
  W(0,'RIFF');dv.setUint32(4,36+pcm.length*2,true);W(8,'WAVE');W(12,'fmt ');dv.setUint32(16,16,true);dv.setUint16(20,1,true);dv.setUint16(22,1,true);
  dv.setUint32(24,outRate,true);dv.setUint32(28,outRate*2,true);dv.setUint16(32,2,true);dv.setUint16(34,16,true);W(36,'data');dv.setUint32(40,pcm.length*2,true);
  new Int16Array(buf,44).set(pcm);let bin='';const u8=new Uint8Array(buf);for(let i=0;i<u8.length;i+=8192)bin+=String.fromCharCode.apply(null,u8.subarray(i,i+8192));return btoa(bin);
}
async function startMic(){
  let stream;
  try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}})}
  catch(e){toast('Permita o microfone no navegador para falar com a Cida.');return}
  const ctx=new (window.AudioContext||window.webkitAudioContext)();await ctx.resume();
  const src=ctx.createMediaStreamSource(stream),proc=ctx.createScriptProcessor(4096,1,1),chunks=[];
  let spoke=false,quiet=0,t0=performance.now(),stopped=false;
  rec={stop};
  micBtn.classList.add('on');setStatus('ouvindo você…','listening');
  proc.onaudioprocess=e=>{
    if(stopped)return;const d=e.inputBuffer.getChannelData(0);chunks.push(new Float32Array(d));
    let s=0;for(const v of d)s+=v*v;const rms=Math.sqrt(s/d.length);
    if(rms>0.02){spoke=true;quiet=0}else if(spoke)quiet+=d.length/ctx.sampleRate;
    if((spoke&&quiet>1.3)||performance.now()-t0>15000||(!spoke&&performance.now()-t0>7000))stop();
  };
  src.connect(proc);proc.connect(ctx.destination);
  async function stop(){
    if(stopped)return;stopped=true;rec=null;
    proc.disconnect();src.disconnect();stream.getTracks().forEach(t=>t.stop());const rate=ctx.sampleRate;ctx.close();
    micBtn.classList.remove('on');
    if(!spoke){setStatus('online agora');toast('Não ouvi nada. Toca no microfone e fala de novo.');return}
    setStatus('entendendo…');
    try{
      const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({acao:'ouvir',audio:wavFrom(chunks,rate)})});
      const j=await r.json();setStatus('online agora');
      if(j.text&&j.text.trim())send(j.text.trim());else toast('Não entendi direito. Tenta de novo?');
    }catch(e){setStatus('online agora');toast('Não consegui ouvir agora. Tenta digitar?')}
  }
}
micBtn.onclick=()=>{
  unlockAudio();

  player.pause();
  startMic();
};
